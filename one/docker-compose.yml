services:
  backend:
    build:
      context: ./srcs/backend
    volumes:
      - ./srcs/backend:/app
      - /app/node_modules
    expose:
      - "3000"
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./srcs/frontend
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
      - /app/.next
    expose:
      - "3000"
    ports:
      - "3001:3000"

  nginx:
    build:
      context: ./srcs/nginx
    ports:
      - "9000:443"
    depends_on:
      - backend
      - frontend
