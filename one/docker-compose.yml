services:
  database:
    build:
      context: ./srcs/database
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - net
    expose:
      - "${DB_PORT}"
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./srcs/backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    networks:
      - net
    volumes:
      - ./srcs/backend:/app
      - /app/node_modules
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./srcs/frontend
    restart: unless-stopped
    networks:
      - net
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
      - /app/.next
    expose:
      - "3000"
    ports:
      - "3001:3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./srcs/nginx
    restart: unless-stopped
    ports:
      - "9000:443"
    networks:
      - net
    depends_on:
      - backend
      - frontend

networks:
  net:
    driver: bridge

volumes:
  postgres_data: